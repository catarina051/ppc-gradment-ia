name: ppc-gradment-ia

x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  n8n:
    image: n8nio/n8n:2.45.7
    restart: unless-stopped
    logging: *logs
    ports:
      - "127.0.0.1:${N8N_PORTA:-5680}:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5680/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Chaves e configuração multi-provedor lidas via $env (nenhum segredo vai para o JSON do workflow)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA1_PROVIDER: ${IA1_PROVIDER:-gemini}
      IA1_MODEL: ${IA1_MODEL:-gemini-3.5-flash-lite}
      IA1_API_KEY: ${IA1_API_KEY:-}
      IA1_BASE_URL: ${IA1_BASE_URL:-}
      IA2_PROVIDER: ${IA2_PROVIDER:-openrouter}
      IA2_MODEL: ${IA2_MODEL:-nvidia/nemotron-3.5-super-vl:free}
      IA2_API_KEY: ${IA2_API_KEY:-}
      IA2_BASE_URL: ${IA2_BASE_URL:-}
      IA3_PROVIDER: ${IA3_PROVIDER:-groq}
      IA3_MODEL: ${IA3_MODEL:-openai/gpt-oss-120b}
      IA3_API_KEY: ${IA3_API_KEY:-}
      IA3_BASE_URL: ${IA3_BASE_URL:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path,zlib
      # A leitura em blocos roda dentro de um Code node e pode levar vários minutos num PPC grande
      N8N_RUNNERS_TASK_TIMEOUT: "3600"
      # Sem persistência de payloads no histórico do SQLite
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/binarios
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      # PPCs universitários podem ter 150-300 páginas (até 50 MiB)
      N8N_FORMDATA_FILE_SIZE_MAX: "50"
      N8N_PAYLOAD_SIZE_MAX: "64"
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_binarios:/home/node/binarios
      - ./prompts:/data/prompts:ro
      - ./samples:/data/samples:ro
      - ./workflows:/data/workflows:ro
    depends_on:
      gotenberg:
        condition: service_started
      extrator:
        condition: service_healthy

  limpeza:
    image: alpine:3.20
    restart: unless-stopped
    logging: *logs
    volumes:
      - n8n_binarios:/binarios
    command: ["sh", "-c", "while true; do find /binarios -type f -mmin +30 -delete; find /binarios -mindepth 1 -type d -empty -delete; sleep 300; done"]

  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    logging: *logs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"

  extrator:
    build: ./services/extrator
    restart: unless-stopped
    logging: *logs
    expose:
      - "8000"

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
  n8n_binarios:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=512m,uid=1000,gid=1000,mode=0700" }

